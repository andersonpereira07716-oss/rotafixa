<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaFixa - Sua Mobilidade Particular</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS para o Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 250px; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <div class="bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 text-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-emerald-400">Rota<span class="text-white">Fixa</span></h1>
                <p class="text-xs text-slate-400">Sua mobilidade particular</p>
            </div>
        </div>
        <button onclick="alert('Configurações do Motorista: Anderson Pereira Silva - Patos/PB')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto w-auto flex-grow space-y-4">
        
        <!-- Nova Corrida Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex items-center space-x-2 text-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <h2 class="font-semibold text-white">Nova Corrida</h2>
            </div>

            <!-- Inputs -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">CLIENTE / ROTA (OPCIONAL)</label>
                    <input type="text" id="descricao" placeholder="Ex: Maria / Casa -> Trabalho" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">VALOR FIXO DA CORRIDA (R$)</label>
                    <input type="number" id="valor" step="0.01" placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-emerald-400 font-bold text-lg placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Mapa de Corrida -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">MAPA DE RASTREIO ATUAL</label>
                <div id="map"></div>
            </div>

            <!-- Botão Gerar Pix -->
            <button onclick="gerarPix()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/20 transition transform active:scale-95">
                Gerar Pagamento Pix
            </button>
        </div>

        <!-- Seção do Pix Gerado (Oculto inicialmente) -->
        <div id="pixContainer" class="hidden bg-slate-900 border border-emerald-500/30 rounded-2xl p-5 shadow-xl space-y-4 text-center">
            <h3 class="font-bold text-emerald-400 text-sm">PIX COPIA E COLA GERADO</h3>
            <div class="flex justify-center">
                <div id="qrcode" class="bg-white p-2 rounded-lg"></div>
            </div>
            <textarea id="pixPayload" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 h-20 resize-none focus:outline-none"></textarea>
            <button onclick="copiarPix()" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 font-semibold py-2.5 rounded-xl transition text-sm">
                Copiar Código Pix
            </button>
        </div>

        <!-- Caixa de Hoje -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20 text-emerald-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <p class="text-xs text-slate-400">Caixa de Hoje</p>
                    <p id="totalCaixa" class="text-lg font-bold text-white">R$ 0,00</p>
                </div>
            </div>
            <button onclick="alert('Histórico de corridas diárias')" class="text-xs font-semibold text-emerald-400 hover:underline">
                Ver histórico >
            </button>
        </div>

    </main>

    <!-- Footer Nav -->
    <footer class="bg-slate-900 border-t border-slate-800 py-3 px-6 flex justify-around text-xs text-slate-400">
        <button class="flex flex-col items-center text-emerald-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
            Nova
        </button>
        <button onclick="alert('Histórico')" class="flex flex-col items-center hover:text-slate-200 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
            Histórico
        </button>
    </footer>

    <!-- Leaflet JS e QRCode JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        // Inicializar o Mapa centralizado em Patos - PB
        let map = L.map('map').setView([-7.0255, -37.2834], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Adicionar marcador na localização atual (simulada/GPS)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                let lat = position.coords.latitude;
                let lng = position.coords.longitude;
                map.setView([lat, lng], 15);
                L.marker([lat, lng]).addTo(map).bindPopup('Você está aqui (Patos-PB)').openPopup();
            }, () => {
                L.marker([-7.0255, -37.2834]).addTo(map).bindPopup('Patos - PB').openPopup();
            });
        }

        // Função de cálculo CRC16 para o padrão Pix EMV
        function calcularCRC16(payload) {
            let polinomio = 0x1021;
            let resultado = 0xFFFF;
            for (let i = 0; i < payload.length; i++) {
                resultado ^= (payload.charCodeAt(i) << 8);
                for (let j = 0; j < 8; j++) {
                    if ((resultado & 0x8000) !== 0) {
                        resultado = ((resultado << 1) ^ polinomio) & 0xFFFF;
                    } else {
                        resultado = (resultado << 1) & 0xFFFF;
                    }
                }
            }
            return resultado.toString(16).toUpperCase().padStart(4, '0');
        }

        // Gerador de Payload Pix Copia e Cola
        function gerarPayloadPix(chave, nome, cidade, valor) {
            let payloadFormatIndicator = "000201";
            let merchantAccountInfo = "0014br.gov.bcb.pix0135" + chave;
            let merchantCategoryCode = "52040000";
            let transactionCurrency = "5303986"; // BRL
            let transactionAmount = valor ? "54" + String(valor.length).padStart(2, '0') + valor : "";
            let countryCode = "5802BR";
            let merchantName = "59" + String(nome.length).padStart(2, '0') + nome;
            let merchantCity = "60" + String(cidade.length).padStart(2, '0') + cidade;
            let additionalDataField = "62070503***";

            let payload = payloadFormatIndicator +
                          "010212" +
                          "26" + String(merchantAccountInfo.length).padStart(2, '0') + merchantAccountInfo +
                          merchantCategoryCode +
                          transactionCurrency +
                          transactionAmount +
                          countryCode +
                          merchantName +
                          merchantCity +
                          additionalDataField +
                          "6304";

            return payload + calcularCRC16(payload);
        }

        let totalArrecadado = 0;

        function gerarPix() {
            let valorInput = document.getElementById('valor').value;
            if (!valorInput || parseFloat(valorInput) <= 0) {
                alert('Por favor, informe um valor válido para a corrida.');
                return;
            }

            let valorFormatado = parseFloat(valorInput).toFixed(2);
            let chavePix = "090.035.784-35";
            let nome = "Anderson Pereira Silva";
            let cidade = "Patos";

            let payload = gerarPayloadPix(chavePix, nome, cidade, valorFormatado);

            // Exibir container do Pix
            document.getElementById('pixContainer').classList.remove('hidden');
            document.getElementById('pixPayload').value = payload;

            // Limpar QR Code anterior e gerar novo
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: payload,
                width: 180,
                height: 180
            });

            // Atualizar caixa do dia simulado
            totalArrecadado += parseFloat(valorFormatado);
            document.getElementById('totalCaixa').innerText = `R$ ${totalArrecadado.toFixed(2).replace('.', ',')}`;
            
            // Rolar suavemente para o QR Code
            document.getElementById('pixContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function copiarPix() {
            let copyText = document.getElementById("pixPayload");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Código Pix Copia e Cola copiado com sucesso!");
        }
    </script>
</body>
</html>
