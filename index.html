<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaFixa - Sua Mobilidade Particular</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS para o Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 250px; width: 100%; border-radius: 0.75rem; z-index: 1; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <div class="bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 text-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-emerald-400">Rota<span class="text-white">Fixa</span></h1>
                <p class="text-xs text-slate-400">Sua mobilidade particular</p>
            </div>
        </div>
        <button onclick="alert('Motorista: Anderson Pereira Silva - Patos/PB')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto w-auto flex-grow space-y-4">
        
        <!-- Nova Corrida Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex items-center space-x-2 text-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                </svg>
                <h2 class="font-semibold text-white">Nova Corrida (Painel do Motorista)</h2>
            </div>

            <!-- Inputs -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">NOME DO PASSAGEIRO</label>
                    <input type="text" id="cliente" placeholder="Ex: Maria" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">LOCAL DE DESTINO (ESCOLHIDO PELO PASSAGEIRO)</label>
                    <div class="flex space-x-2">
                        <input type="text" id="destino" placeholder="Ex: Centro, Patos - PB" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition text-sm">
                        <button onclick="buscarDestinoNoMapa()" class="bg-slate-800 hover:bg-slate-700 px-4 rounded-xl border border-slate-700 text-emerald-400 text-xs font-bold transition">Buscar</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">VALOR FIXO DA CORRIDA (R$) - DEFINIDO PELO MOTORISTA</label>
                    <input type="number" id="valor" step="0.01" placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-emerald-400 font-bold text-lg placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Mapa Interativo -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">MAPA DE ROTA E DESTINO</label>
                <div id="map"></div>
                <p class="text-[10px] text-slate-500 mt-1">Toque no mapa ou use a busca para marcar o destino.</p>
            </div>

            <!-- Botão Gerar Pix -->
            <button onclick="gerarPix()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/20 transition transform active:scale-95">
                Gerar Pagamento Pix da Corrida
            </button>
        </div>

        <!-- Seção do Pix Gerado -->
        <div id="pixContainer" class="hidden bg-slate-900 border border-emerald-500/30 rounded-2xl p-5 shadow-xl space-y-4 text-center">
            <h3 class="font-bold text-emerald-400 text-sm">PIX COPIA E COLA GERADO</h3>
            <p id="detalhesCorridaResumo" class="text-xs text-slate-300"></p>
            <div class="flex justify-center">
                <div id="qrcode" class="bg-white p-2 rounded-lg"></div>
            </div>
            <textarea id="pixPayload" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 h-20 resize-none focus:outline-none"></textarea>
            <button onclick="copiarPix()" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 font-semibold py-2.5 rounded-xl transition text-sm">
                Copiar Código Pix
            </button>
        </div>

        <!-- Caixa de Hoje -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20 text-emerald-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <p class="text-xs text-slate-400">Caixa de Hoje</p>
                    <p id="totalCaixa" class="text-lg font-bold text-white">R$ 0,00</p>
                </div>
            </div>
            <span class="text-xs font-semibold text-emerald-400">Patos - PB</span>
        </div>

    </main>

    <!-- Leaflet JS e QRCode JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        // Inicializar o Mapa centralizado em Patos - PB
        let map = L.map('map').setView([-7.0255, -37.2834], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let markerDestino = null;

        // Permitir que o motorista/passageiro clique no mapa para definir o destino
        map.on('click', function(e) {
            let lat = e.latlng.lat;
            let lng = e.latlng.lng;
            
            if (markerDestino) {
                map.removeLayer(markerDestino);
            }
            markerDestino = L.marker([lat, lng]).addTo(map).bindPopup('Destino selecionado').openPopup();
            document.getElementById('destino').value = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
        });

        // Buscar coordenadas pelo nome digitado usando Nominatim (OpenStreetMap)
        function buscarDestinoNoMapa() {
            let query = document.getElementById('destino').value;
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", Patos, Paraíba")}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        let lat = parseFloat(data[0].lat);
                        let lon = parseFloat(data[0].lon);
                        
                        map.setView([lat, lon], 16);
                        if (markerDestino) {
                            map.removeLayer(markerDestino);
                        }
                        markerDestino = L.marker([lat, lon]).addTo(map).bindPopup(data[0].display_name).openPopup();
                    } else {
                        alert('Endereço não encontrado em Patos. Tente especificar melhor.');
                    }
                })
                .catch(() => alert('Erro ao buscar o endereço.'));
        }

        // Funções de Cálculo Pix EMV
        function calcularCRC16(payload) {
            let polinomio = 0x1021;
            let resultado = 0xFFFF;
            for (let i = 0; i < payload.length; i++) {
                resultado ^= (payload.charCodeAt(i) << 8);
                for (let j = 0; j < 8; j++) {
                    if ((resultado & 0x8000) !== 0) {
                        resultado = ((resultado << 1) ^ polinomio) & 0xFFFF;
                    } else {
                        resultado = (resultado << 1) & 0xFFFF;
                    }
                }
            }
            return resultado.toString(16).toUpperCase().padStart(4, '0');
        }

        function gerarPayloadPix(chave, nome, cidade, valor) {
            let payloadFormatIndicator = "000201";
            let merchantAccountInfo = "0014br.gov.bcb.pix0135" + chave;
            let merchantCategoryCode = "52040000";
            let transactionCurrency = "5303986";
            let transactionAmount = valor ? "54" + String(valor.length).padStart(2, '0') + valor : "";
            let countryCode = "5802BR";
            let merchantName = "59" + String(nome.length).padStart(2, '0') + nome;
            let merchantCity = "60" + String(cidade.length).padStart(2, '0') + cidade;
            let additionalDataField = "62070503***";

            let payload = payloadFormatIndicator +
                          "010212" +
                          "26" + String(merchantAccountInfo.length).padStart(2, '0') + merchantAccountInfo +
                          merchantCategoryCode +
                          transactionCurrency +
                          transactionAmount +
                          countryCode +
                          merchantName +
                          merchantCity +
                          additionalDataField +
                          "6304";

            return payload + calcularCRC16(payload);
        }

        let totalArrecadado = 0;

        function gerarPix() {
            let valorInput = document.getElementById('valor').value;
            let cliente = document.getElementById('cliente').value || "Passageiro";
            let destino = document.getElementById('destino').value || "Destino livre";

            if (!valorInput || parseFloat(valorInput) <= 0) {
                alert('Por favor, informe o valor fixo da corrida.');
                return;
            }

            let valorFormatado = parseFloat(valorInput).toFixed(2);
            let payload = gerarPayloadPix("090.035.784-35", "Anderson Pereira Silva", "Patos", valorFormatado);

            document.getElementById('pixContainer').classList.remove('hidden');
            document.getElementById('detalhesCorridaResumo').innerText = `Passageiro: ${cliente} | Destino: ${destino} | Valor: R$ ${valorFormatado.replace('.', ',')}`;
            document.getElementById('pixPayload').value = payload;

            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: payload,
                width: 180,
                height: 180
            });

            totalArrecadado += parseFloat(valorFormatado);
            document.getElementById('totalCaixa').innerText = `R$ ${totalArrecadado.toFixed(2).replace('.', ',')}`;
            
            document.getElementById('pixContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function copiarPix() {
            let copyText = document.getElementById("pixPayload");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Código Pix copiado!");
        }
    </script>
</body>
</html>
