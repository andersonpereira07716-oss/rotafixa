<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaFixa - Mobilidade Urbana com Tarifa Fixa em Patos - PB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-6 md:p-10">

    <header class="w-full max-w-7xl flex items-center justify-between py-4 border-b border-slate-800/50 mb-6">
        <div class="flex items-center gap-3">
            <img src="splash.jpg" alt="RotaFixa" class="w-10 h-10 rounded-full border border-red-500/40 object-cover">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">ROTA<span class="text-red-600">FIXA</span></h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-400">Patos - PB</span>
            <div class="w-2 h-2 bg-red-600 rounded-full animate-pulse"></div>
        </div>
    </header>

    <main class="w-full max-w-7xl flex flex-col md:flex-row items-center justify-center gap-8 my-auto">
        <div class="w-full md:w-1/2 flex items-center justify-center">
            <div class="relative group">
                <div class="absolute -inset-1.5 bg-gradient-to-r from-red-800 to-slate-900 rounded-3xl blur opacity-50"></div>
                <div class="relative w-64 h-64 md:w-80 md:h-80 rounded-3xl overflow-hidden shadow-2xl border-4 border-red-600/50 bg-slate-900 flex items-center justify-center">
                    <img src="splash.jpg" alt="Logomarca RotaFixa" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <div class="w-full md:w-1/2 text-center md:text-left space-y-6">
            <h2 class="text-3xl md:text-5xl font-extrabold text-white leading-tight">
                Sua viagem em Patos, <br/>com <span class="text-red-500">preço fixo</span> e segurança.
            </h2>
            <p class="text-base md:text-lg text-slate-300 max-w-xl mx-auto md:mx-0">
                Conectamos você aos melhores motoristas e mototáxis da região. Pague com facilidade via Pix e tenha a certeza do valor antes de embarcar.
            </p>
            
            <div class="flex flex-col sm:flex-row items-center gap-4 pt-2">
                <a href="https://wa.me/5583998765554" target="_blank" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white text-center py-4 px-10 rounded-xl font-bold transition shadow-lg shadow-red-600/30 text-lg">
                    Chamar no WhatsApp
                </a>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-7xl border-t border-slate-800/50 mt-12 pt-6 pb-4 text-center">
        <p class="text-sm text-slate-500">
            © 2026 RotaFixa Patos - Anderson Pereira Silva.
        </p>
    </footer>

</body>
</html>
