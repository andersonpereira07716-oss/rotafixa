<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaFixa - Mobilidade Urbana em Patos</title>
    <!-- Tailwind CSS CDN para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between items-center p-6">

    <!-- Cabeçalho -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-2xl font-bold tracking-wider text-red-500">ROTAFIXA</h1>
        <p class="text-xs text-slate-400">Tarifa fixa e segurança para Patos - PB</p>
    </header>

    <!-- Conteúdo Principal com a Imagem de Splash -->
    <main class="w-full max-w-md flex flex-col items-center justify-center my-auto space-y-6">
        <div class="w-48 h-48 rounded-2xl overflow-hidden shadow-2xl border-2 border-red-500/30 bg-slate-900 flex items-center justify-center">
            <!-- Certifique-se de que o arquivo splash.jpg está na mesma pasta ou ajuste o caminho em src -->
            <img src="splash.jpg" alt="Logo RotaFixa" class="w-full h-full object-cover">
        </div>
        
        <div class="text-center space-y-2">
            <h2 class="text-xl font-semibold">Sua viagem garantida</h2>
            <p class="text-sm text-slate-400 px-4">Conectando passageiros a motoristas particulares e mototáxis com pagamento facilitado via Pix.</p>
        </div>
    </main>

    <!-- Rodapé com Ações -->
    <footer class="w-full max-w-md space-y-4 pb-4">
        <a href="#entrar" class="w-full block bg-red-600 hover:bg-red-700 text-center py-3 rounded-xl font-medium transition shadow-lg shadow-red-600/30">
            Acessar Plataforma
        </a>
        <p class="text-center text-xs text-slate-500">© 2026 RotaFixa - Todos os direitos reservados</p>
    </footer>

</body>
</html>
